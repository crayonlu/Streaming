# Temporary: reproduces the AppImageHub test (code/worker.sh in
# AppImage/appimage.github.io) closely enough to prove that the AppImage can be
# *extracted* and started as an unprivileged user, which is what firejail does.
# Builds only; publishes nothing. Delete once the fix is verified.
name: AppImage extract check

on:
  push:
    branches: [fix/appimage-extract-perms]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Make Tauri's cached AppRun world-executable
        run: |
          mkdir -p "$HOME/.cache/tauri"
          curl -fsSL -o "$HOME/.cache/tauri/AppRun-x86_64" \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          chmod 755 "$HOME/.cache/tauri/AppRun-x86_64"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri

      - name: Extract the AppImage as root and check permissions
        run: |
          APPIMAGE="$PWD/$(find src-tauri/target -name '*.AppImage' -path '*bundle*' | head -n 1)"
          echo "Checking $APPIMAGE"
          chmod +x "$APPIMAGE"
          WORK=$(mktemp -d)
          cd "$WORK"
          # firejail runs as root (it is setuid), so the extracted tree keeps
          # the ownership and modes stored in the SquashFS. The app is then
          # started as an unprivileged user, which is what makes a 0770
          # AppRun.wrapped unusable.
          sudo "$APPIMAGE" --appimage-extract > /dev/null
          MODE=$(sudo stat -c '%a' squashfs-root/AppRun.wrapped)
          sudo stat -c '%A %a %U:%G %n' squashfs-root/AppRun squashfs-root/AppRun.wrapped
          echo "AppRun.wrapped mode: $MODE"
          case "$MODE" in
            *[1357]) ;;
            *) echo "::error::AppRun.wrapped is $MODE, so users other than the owner cannot execute it"; exit 1 ;;
          esac
          echo "$WORK" > /tmp/appdir-path

      - name: Start the extracted AppImage under Xvfb without network
        run: |
          sudo apt-get install -y xvfb icewm x11-utils
          # Extract again as this user so the app can be started from the tree.
          APPIMAGE="$PWD/$(find src-tauri/target -name '*.AppImage' -path '*bundle*' | head -n 1)"
          WORK=$(mktemp -d)
          cd "$WORK"
          "$APPIMAGE" --appimage-extract > /dev/null
          export DISPLAY=:99
          Xvfb :99 -screen 0 800x600x24 > /dev/null 2>&1 &
          sleep 2
          # The AppImageHub worker sets these for WebKitGTK apps; without them
          # the web view renders a blank window under Xvfb's software rendering.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          ./squashfs-root/AppRun &
          APID=$!
          sleep 12
          if ! kill -0 $APID 2>/dev/null ; then
            echo "::error::the application exited right after starting"
            exit 1
          fi
          WINDOWS=$(xwininfo -tree -root)
          echo "$WINDOWS" | grep -E '0x.*": \(' || { echo "::error::no window appeared"; exit 1; }
          echo "The application is still running and shows a window"
          kill $APID 2>/dev/null || true
