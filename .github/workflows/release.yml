name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (e.g. v0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  PRODUCT_NAME: streaming
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # No `version` input: action-setup reads packageManager from
        # package.json — pinning both causes a version-mismatch failure.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 (packageManager field) requires Node >= 22.13
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true
          cache-on-failure: true

      - name: Update Cargo index
        working-directory: src-tauri
        run: cargo update

      - name: Install Linux build dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - name: Install create-dmg (macOS only)
        if: matrix.platform == 'macos-latest'
        run: npm install --global create-dmg

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      # tauri-bundler writes its AppRun binary into the tools cache with mode
      # 0770 (crates/tauri-bundler/.../appimage/mod.rs, `write_and_make_executable`),
      # copies it into the AppDir, and linuxdeploy then renames it to
      # AppRun.wrapped without touching its mode. Mounted through FUSE the owner
      # is remapped to the caller, so the AppImage still starts; anything that
      # *extracts* it instead (firejail, --appimage-extract-and-run, systems
      # without FUSE) keeps root:root 0770 and dies with
      # "AppRun.wrapped: Permission denied".
      #
      # Tauri only downloads the file when it is missing, so seeding the cache
      # with a world-executable copy is enough to fix the artifact. The URL and
      # file name are the ones tauri-bundler itself uses; the check below fails
      # the job if this ever stops having the intended effect.
      - name: Make Tauri's cached AppRun world-executable
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p "$HOME/.cache/tauri"
          curl -fsSL -o "$HOME/.cache/tauri/AppRun-x86_64" \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          chmod 755 "$HOME/.cache/tauri/AppRun-x86_64"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ env.VERSION }}
          releaseName: "${{ env.PRODUCT_NAME }} ${{ env.VERSION }}"
          releaseBody: "Built from ${{ github.sha }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Extraction keeps the ownership and modes stored in the SquashFS, which
      # is what firejail (and therefore the AppImageHub test) does. Assert that
      # an unprivileged user could start the app that way.
      - name: Check that the AppImage runs when extracted
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          APPIMAGE="$PWD/$(find src-tauri/target -name '*.AppImage' -path '*bundle*' | head -n 1)"
          echo "Checking $APPIMAGE"
          chmod +x "$APPIMAGE"
          WORK=$(mktemp -d)
          cd "$WORK"
          "$APPIMAGE" --appimage-extract > /dev/null
          stat -c '%A %a %U:%G %n' squashfs-root/AppRun squashfs-root/AppRun.wrapped
          if [ ! -x squashfs-root/AppRun.wrapped ] ; then
            echo "::error::AppRun.wrapped is not executable; an extracted AppImage cannot start"
            exit 1
          fi
