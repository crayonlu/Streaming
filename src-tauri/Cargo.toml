[package]
name = "streaming"
version = "0.6.1"
description = "A desktop app for streaming video content from various platforms.  "
authors = ["crayon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "streaming_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "macos-private-api",
  # Menu-bar status item (NSStatusItem) hosting the playback title.
  "tray-icon",
  # Decodes icons/tray-icon.png at runtime for the tray image.
  "image-png",
] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
  "native-tls",
] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deno_core = "0.288.0"
html-escape = "0.2.13"
md-5 = "0.10"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
regex = "1"
cookie = "0.18"
url = "2.5"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
flate2 = "1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# App Nap opt-out for background playback (see src/power.rs). Versions are
# pinned to the ones already pulled in transitively by tauri/wry, so this adds
# no new compilation units.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSProcessInfo",
] }
